[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mofedcyber"
version = "1.0.0"
description = "MOFedCyber: convergence-guaranteed Pareto aggregation for private and Byzantine-resilient federated intrusion detection"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Ali Mansour Al-madani"}, {name = "Xu Ying"}]
requires-python = ">=3.9"
dependencies = ["torch>=2.1", "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3",
                "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dp = ["dp-accounting>=0.4"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["mofedcyber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]

[tool.black]
line-length = 110
target-version = ["py39"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B905", "UP006", "UP035", "UP007", "UP045"]

[tool.ruff.lint.isort]
known-first-party = ["mofedcyber"]
